name: CI

# CI runs on main only — PR checks were removed for providing no signal
# over the main-branch run.
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: build-and-test
    # The agent core (NilesCore/Agent) uses FoundationModels APIs that only
    # exist in the iOS 27 SDK — building with Xcode 26.x fails with "cannot
    # find type 'LanguageModel' in scope". The xcode-27 image (public
    # preview) ships Xcode 27.0-27.2; "Select newest Xcode" below picks 27.2.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Niles.xcodeproj \
            -scheme Niles

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signed on purpose: SecItem fails with errSecMissingEntitlement
      # (-34018) in an unsigned test host, which would skip verification of the
      # Keychain-backed token-store tests. The entitlements and generated
      # Info.plists live in project.yml.
      #
      # -retry-tests-on-failure: the runner's simulator intermittently fails to
      # launch or terminate the app under test ("Failed to get background
      # assertion", "Failed to terminate") — on a1924d0 the same SHA failed
      # three times, each time on a different UI test, each test passing in at
      # least one of the three runs. This reruns only the failed tests in the
      # same run instead of failing the job; it is not a skip.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
