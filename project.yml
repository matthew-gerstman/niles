name: Niles
options:
  bundleIdPrefix: com.gerstman
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  MCPSwift:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  Niles:
    type: application
    platform: iOS
    sources:
      - path: Niles
    entitlements:
      path: Niles/Niles.entitlements
      properties:
        com.apple.developer.homekit: true
        # Default access group. Simulator test hosts need an explicit keychain
        # entitlement or SecItem fails with errSecMissingEntitlement (-34018).
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.gerstman.niles"
    info:
      path: Niles/Info.plist
      properties:
        CFBundleDisplayName: Niles
        # Version values come from the target's build settings so this stays
        # the single source of truth in project.yml.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSHomeKitUsageDescription: >-
          Niles reads your home layout so agents can propose configuration
          changes for your review, and applies changes you approve.
        NSLocalNetworkUsageDescription: >-
          Niles advertises an MCP server on your local network so agents on the
          same network can discover and connect to it.
        NSBonjourServices:
          - "_niles-mcp._tcp"
    dependencies:
      - target: NilesCore
      # The store's stage path takes MCP.Value arguments, so the app target
      # links the package directly instead of reaching through NilesCore.
      - package: MCPSwift
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerstman.niles
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team scoped to the app target: frameworks and tests stay unsigned, and
        # other contributors can override their own team without editing this file.
        DEVELOPMENT_TEAM: DVM2MJ6Z3Q

  NilesCore:
    type: framework
    platform: iOS
    sources:
      - path: NilesCore/Sources
    dependencies:
      - package: MCPSwift
        product: MCP
    info:
      path: NilesCore/Info.plist
      properties:
        CFBundleDisplayName: NilesCore

  NilesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NilesCore/Tests
    dependencies:
      - target: NilesCore
      - package: MCPSwift
        product: MCP
    settings:
      base:
        # Host the Core tests in the app process: the keychain entitlements
        # that SecItem needs live on the host app, not the generated runner.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Niles.app/Niles
        BUNDLE_LOADER: $(TEST_HOST)
        # Signing (even ad-hoc, as the simulator test action does) requires an
        # Info.plist; generate one so the Keychain-backed tests can run signed.
        GENERATE_INFOPLIST_FILE: YES

  # App-target unit tests: exercise the live UI wiring (LiveNilesStore) inside
  # the app process, since the view models live in the app target.
  NilesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NilesTests
    dependencies:
      - target: Niles
      - package: MCPSwift
        product: MCP
    settings:
      base:
        # See NilesCoreTests: ad-hoc signing needs an Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Niles.app/Niles
        BUNDLE_LOADER: $(TEST_HOST)

  # UI tests: drive the real simulator app (demo fixture) as evidence capture —
  # the Home swipe-to-stage flow and the consolidated Settings screen.
  NilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NilesUITests
    dependencies:
      - target: Niles
    settings:
      base:
        # See NilesCoreTests: ad-hoc signing needs an Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Niles
        PRODUCT_BUNDLE_IDENTIFIER: com.gerstman.niles.uitests

schemes:
  Niles:
    build:
      targets:
        Niles: all
        NilesCoreTests: [test]
        NilesTests: [test]
        NilesUITests: [test]
    test:
      targets:
        - NilesCoreTests
        - NilesTests
        - NilesUITests
