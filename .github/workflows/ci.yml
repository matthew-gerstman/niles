name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          # Package.resolved is generated (project comes from XcodeGen), so key
          # on project.yml, which pins the MCP Swift SDK to an exact version.
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Niles.xcodeproj \
            -scheme Niles

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signed on purpose: SecItem fails with errSecMissingEntitlement
      # (-34018) in an unsigned test host, which would skip verification of the
      # Keychain-backed token-store tests. The entitlements and generated
      # Info.plists live in project.yml.
      # UI tests are ~50s of execution plus a third simulator boot; PRs run
      # unit tests only. Full suite including UI tests runs on main.
      - name: Test (unit)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skip-testing:NilesUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test (UI, main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NilesUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
