name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: build-and-test
    # The agent core (NilesCore/Agent) uses FoundationModels APIs that only
    # exist in the iOS 27 SDK — building with Xcode 26.x fails with "cannot
    # find type 'LanguageModel' in scope". The xcode-27 image (public
    # preview) ships Xcode 27.0-27.2; "Select newest Xcode" below picks 27.2.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Niles.xcodeproj \
            -scheme Niles

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signed on purpose: SecItem fails with errSecMissingEntitlement
      # (-34018) in an unsigned test host, which would skip verification of the
      # Keychain-backed token-store tests. The entitlements and generated
      # Info.plists live in project.yml.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Niles.xcodeproj \
            -scheme Niles \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
