name: Niles
options:
  bundleIdPrefix: com.gerstman
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: DVM2MJ6Z3Q
    CODE_SIGN_STYLE: Automatic

targets:
  Niles:
    type: application
    platform: iOS
    sources:
      - path: Niles
    entitlements:
      path: Niles/Niles.entitlements
      properties:
        com.apple.developer.homekit: true
    info:
      path: Niles/Info.plist
      properties:
        CFBundleDisplayName: Niles
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >-
          Niles advertises an MCP server on your local network so agents on the
          same network can discover and connect to it.
        NSBonjourServices:
          - "_niles-mcp._tcp"
    dependencies:
      - target: NilesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerstman.niles
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  NilesCore:
    type: framework
    platform: iOS
    sources:
      - path: NilesCore/Sources
    info:
      path: NilesCore/Info.plist
      properties:
        CFBundleDisplayName: NilesCore

  NilesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NilesCore/Tests
    dependencies:
      - target: NilesCore

schemes:
  Niles:
    build:
      targets:
        Niles: all
        NilesCoreTests: [test]
    test:
      targets:
        - NilesCoreTests
