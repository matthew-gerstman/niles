name: Niles
options:
  bundleIdPrefix: com.gerstman
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  # Local SwiftPM package: proposal pipeline, HomeKit adapters, LAN MCP
  # transport, and agent layer (cleanup W1). The MCP SDK is a package-
  # internal dependency of NilesCore — the app links only this product.
  NilesCore:
    path: NilesCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  Niles:
    type: application
    platform: iOS
    sources:
      - path: Niles
    entitlements:
      path: Niles/Niles.entitlements
      properties:
        com.apple.developer.homekit: true
        # Default access group. Simulator test hosts need an explicit keychain
        # entitlement or SecItem fails with errSecMissingEntitlement (-34018).
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.gerstman.niles"
    info:
      path: Niles/Info.plist
      properties:
        CFBundleDisplayName: Niles
        # Version values come from the target's build settings so this stays
        # the single source of truth in project.yml.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSHomeKitUsageDescription: >-
          Niles reads your home layout so agents can propose configuration
          changes for your review, and applies changes you approve.
        NSLocalNetworkUsageDescription: >-
          Niles advertises an MCP server on your local network so agents on the
          same network can discover and connect to it.
        NSBonjourServices:
          - "_niles-mcp._tcp"
    dependencies:
      - package: NilesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerstman.niles
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team scoped to the app target: frameworks and tests stay unsigned, and
        # other contributors can override their own team without editing this file.
        DEVELOPMENT_TEAM: DVM2MJ6Z3Q

schemes:
  Niles:
    build:
      targets:
        Niles: all
